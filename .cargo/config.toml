[target.aarch64-unknown-linux-musl]
# 使用项目内包装脚本：展开 rustc 的 @响应文件、过滤 lld 不支持的
# --fix-cortex-a53-843419，并规避 Windows 命令行长度上限。
# linker 必须是绝对路径（rustc 不解析相对 .bat）。
# 请将 <YOUR_PROJECT_DIR> 替换为你的项目根目录的绝对路径。
linker = "<YOUR_PROJECT_DIR>\\tools\\zig-cc.bat"

[env]
# relative = true 让 cargo 把相对路径展开为相对项目根的绝对路径，
# 否则 cc-rs 用相对路径调用 .bat 会报「系统找不到指定的路径」。
CC_aarch64_unknown_linux_musl = { value = "tools/zig-cc.bat", relative = true }
CXX_aarch64_unknown_linux_musl = { value = "tools/zig-cc.bat", relative = true }
# 旧值 "C:\...\zig\zig.exe ar" 把参数写进了可执行文件名，
# 会让 ring 的 build script 一直卡住。
AR_aarch64_unknown_linux_musl = { value = "tools/zig-ar.bat", relative = true }
