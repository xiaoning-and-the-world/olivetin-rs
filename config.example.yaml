# OliveTin-RS 示例配置（路由器推荐配置 + 四种定时模式 + 参数发现 + 版本管理 + 上传）
config_version: 1

max_concurrent: 2
log_capacity: 100
log_directory: "/tmp/olivetin-logs"
log_retention_days: 7
log_max_total_mb: 20
min_free_mb: 50
max_output_kb: 32

default_timezone: "+08:00"
inject_tz: true

# 可回退版本数量：1~50，默认 5。超出上限自动清理最旧版本，不提供无限保存。
max_versions: 5
# 面板把 shell 命令写成的 .sh 脚本目录；留空用默认 /opt/olivetin/scripts。
script_directory: "/opt/olivetin/scripts"
# 分组列表：order=前后顺序（留空按名称排序）、position=top/left/right、
# layout=vertical/horizontal、collapse=首次进入是否默认收起。
group_order: []
group_panel_position: "top"
group_layout: "vertical"
collapse_groups_by_default: false

rate_limit:
  enabled: true
  per_minute: 10

auth:
  # 默认关闭：首次访问无需 token。可在「设置 → 安全模式」里开启。
  enabled: false
  token_file: "/etc/olivetin-rs/token.txt"
  cookie_ttl_hours: 168
  trust_proxy: false

push:
  enabled: true
  spt: "${WXPUSHER_SPT}"
  content_type: 1
  summary_prefix: "OliveTin"
  timeout: 10
  include_output: false
  shutdown_wait_ms: 2000

actions:
  # 1. 签到任务（daily 模式 + 版本管理 + 面板内上传）
  - id: "checkin"
    title: "签到任务"
    group: "签到"
    exec: ["/opt/olivetin/checkin/current/my-binary"]
    timeout: 60
    concurrency: 1
    description: "每日签到"
    push: true
    env:
      CONFIG_PATH: "/opt/olivetin/checkin/current/config.json"
    versioning:
      enabled: true
      base_dir: "/opt/olivetin/checkin"
      binary_name: "my-binary"
      config_name: "config.json"
      upload:
        enabled: true
        max_binary_mb: 50
        max_config_kb: 256
    schedule:
      enabled: true
      mode: daily
      timezone: "+08:00"
      skip_if_running: true
      time: "08:00"
    args:
      - name: "date"
        description: "指定日期，YYYY-MM-DD"
        required: false
        default: null
        type: string
        style: option
    discover:
      enabled: true
      command: ["help"]
      parser: "clap"
      timeout: 5

  # 2. 每周备份（weekly 模式）
  - id: "weekly-backup"
    title: "每周备份"
    group: "备份"
    exec: ["/usr/local/bin/backup.sh"]
    timeout: 300
    schedule:
      enabled: true
      mode: weekly
      weekdays: [1, 3, 5]
      time: "09:00"

  # 3. 月度报告（monthly 模式）
  - id: "monthly-report"
    title: "月度报告"
    group: "报告"
    exec: ["/usr/local/bin/report.sh"]
    timeout: 120
    schedule:
      enabled: true
      mode: monthly
      days: [1, 15]
      time: "02:00"

  # 4. 自定义 cron
  - id: "custom-cron"
    title: "自定义定时"
    group: "默认"
    exec: ["/usr/local/bin/custom.sh"]
    timeout: 60
    schedule:
      enabled: true
      mode: cron
      cron: "*/30 * * * *"

  # 5. 禁用示例（不出现在面板）
  - id: "disabled-demo"
    title: "禁用示例"
    enabled: false
    exec: ["/bin/echo"]
    args:
      - name: "msg"
        description: "要输出的内容"
        required: false
        default: "hello"
        type: string
        style: positional
